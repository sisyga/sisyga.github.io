- when: Nov 2026
  text: 'New preprint: <a href="https://arxiv.org/abs/2611.05413">MorpheusAI</a>, in which LLM agents build, run and refine virtual tissue models from published studies without human intervention. With Prerana Chandratre, Lutz Brusch and colleagues at CIDS.'

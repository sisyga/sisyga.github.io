<section id="news">
  <div class="wrap">
    <div class="sec-head"><div><div class="label">News</div><h2>Recent news</h2></div></div>
    <div class="news">
      {% for item in site.data.news limit:6 %}<div class="tl__item"><div class="tl__when">{{ item.when }}</div><div class="tl__what">{{ item.text }}</div></div>
      {% endfor %}
    </div>{% if site.data.news.size > 6 %}
    <details class="news__more"><summary>Earlier news</summary><div class="news">
      {% for item in site.data.news offset:6 %}<div class="tl__item"><div class="tl__when">{{ item.when }}</div><div class="tl__what">{{ item.text }}</div></div>
      {% endfor %}
    </div></details>{% endif %}
  </div>
</section>
